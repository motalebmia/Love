<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রেমের পেজ</title>
<style>
  /* Reset and base styles */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to top, #ff9a9e, #fad0c4); 
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
  }

  /* Container for hearts */
  .heart-container {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Heart style */
  .heart {
    position: absolute;
    bottom: 0;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    border-radius: 50%;
    padding: 10px;
    user-select: none;
    pointer-events: auto;
    animation: floatUp linear forwards;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
  }

  /* Blast animation */
  .blast {
    animation: explode 0.5s forwards;
  }

  @keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  /* Bottom love text */
  .love-text {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 500px;
    background: rgba(255,255,255,0.2);
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    color: #fff;
    font-size: 18px;
    margin-bottom: 20px;
    backdrop-filter: blur(5px);
    animation: fadeInText 2s ease forwards;
  }

  @keyframes fadeInText {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

</style>
</head>
<body>

<div class="heart-container"></div>

<div class="love-text">
  নাজমিন এবং মোতালেবের ভালোবাসা সবসময় একে অপরের হৃদয়ে থাকবে।<br>
  এ ভালোবাসা সময়ের সাথে আরও গভীর হবে, প্রতিটি মুহূর্তে তারা একে অপরের পাশে থাকবে।<br>
  সত্যিকারের ভালোবাসা হল একে অপরকে বোঝা, শ্রদ্ধা করা এবং প্রতিটি দিনকে সুন্দর করে তোলা।
</div>

<script>
  const heartContainer = document.querySelector('.heart-container');

  const names = ["নাজমিন", "মোতালেব"];
  const colors = ["#ff4d6d", "#ff6f91", "#ff9671", "#ffc75f", "#f9f871"];
  const sizes = [20, 25, 30, 35, 40, 45, 50];

  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    
    // Random Name
    heart.textContent = Math.random() < 0.7 ? names[0] : names[1];

    // Random Color
    heart.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

    // Random Size
    const size = sizes[Math.floor(Math.random() * sizes.length)];
    heart.style.fontSize = `${size}px`;
    heart.style.width = `${size*2}px`;
    heart.style.height = `${size*2}px`;
    heart.style.lineHeight = `${size*2}px`;

    // Random horizontal position
    heart.style.left = Math.random() * 90 + 'vw';

    // Random animation duration
    heart.style.animationDuration = (5 + Math.random() * 5) + 's';

    // Click to explode
    heart.addEventListener('click', () => {
      heart.classList.add('blast');
      setTimeout(() => heart.remove(), 500);
    });

    heartContainer.appendChild(heart);

    // Remove after animation
    setTimeout(() => {
      heart.remove();
    }, 10000);
  }

  // Create hearts continuously
  setInterval(createHeart, 500);
</script>

</body>
</html>
