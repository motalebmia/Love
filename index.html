<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রেমের পেজ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(160deg, #ff9a9e, #fad0c4, #fbc2eb);
    background-size: 400% 400%;
    animation: bgGradient 15s ease infinite;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
  }

  @keyframes bgGradient {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
  }

  .heart-container {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .heart {
    position: absolute;
    bottom: 0;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: white;
    border-radius: 50%;
    text-align: center;
    line-height: 1;
    pointer-events: auto;
    user-select: none;
    animation: floatUp linear forwards;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    50% { transform: translateY(-50vh) scale(1.1); opacity: 0.9; }
    100% { transform: translateY(-120vh) scale(1.3); opacity: 0; }
  }

  .blast {
    animation: explode 0.5s forwards;
  }

  @keyframes explode {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  .love-text {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 500px;
    background: rgba(255,255,255,0.15);
    padding: 20px;
    border-radius: 25px;
    text-align: center;
    color: #fff;
    font-size: 18px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
    line-height: 1.6;
  }

</style>
</head>
<body>

<div class="heart-container"></div>

<div class="love-text">
  নাজমিন এবং মোতালেবের ভালোবাসা অনন্ত।<br>
  প্রতিটি মুহূর্ত তাদের জন্য আনন্দ এবং একে অপরের প্রতি শ্রদ্ধা ও যত্নের সাক্ষী।<br>
  সত্যিকারের ভালোবাসা হলো একে অপরকে বোঝা, সম্মান করা এবং প্রতিদিনকে আরও সুন্দর করে তোলা।
</div>

<script>
  const heartContainer = document.querySelector('.heart-container');
  const names = ["নাজমিন", "মোতালেব"];
  const colors = ["#ff4d6d", "#ff6f91", "#ff9671", "#ffc75f", "#f9f871"];
  const sizes = [30, 35, 40, 45, 50, 55];

  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');

    // Random name
    heart.textContent = names[Math.floor(Math.random() * names.length)];

    // Random background color
    const color = colors[Math.floor(Math.random() * colors.length)];
    heart.style.backgroundColor = color;

    // Random size
    const size = sizes[Math.floor(Math.random() * sizes.length)];
    heart.style.width = size + "px";
    heart.style.height = size + "px";
    heart.style.lineHeight = size + "px";
    heart.style.fontSize = (size/3) + "px";

    // Random horizontal position
    heart.style.left = Math.random() * 90 + "vw";

    // Random animation duration
    heart.style.animationDuration = (5 + Math.random()*5) + "s";

    // Click to explode
    heart.addEventListener('click', () => {
      heart.classList.add('blast');
      setTimeout(() => heart.remove(), 500);
    });

    heartContainer.appendChild(heart);

    // Remove after 10s
    setTimeout(() => {
      heart.remove();
    }, 10000);
  }

  setInterval(createHeart, 400);
</script>

</body>
</html>
