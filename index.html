<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Animation</title>

<!-- Ador Noirrit Bangla Font -->
<link href="https://fonts.cdnfonts.com/css/li-ador-noirrit" rel="stylesheet">

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body {
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    background: linear-gradient(160deg,#ff9a9e,#fad0c4,#fbc2eb);
    background-size:400% 400%;
    animation: bgAnim 15s ease infinite;
    font-family: 'Li Ador Noirrit', sans-serif;
    position:relative;
  }

  @keyframes bgAnim {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .heart-container {
    position:absolute;
    bottom:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .heart {
    position:absolute;
    bottom:0;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    pointer-events:auto;
    user-select:none;
    border-radius:50%;
    background-color:#ff4d6d;
    color:white;
    animation: floatUp linear forwards;
    box-shadow: 0px 2px 8px rgba(0,0,0,0.3);
  }

  @keyframes floatUp {
    0%{transform:translateY(0) scale(1);}
    100%{transform:translateY(-120vh) scale(1.2);}
  }

  .blast {
    animation: explode 0.4s forwards;
    box-shadow: 0px 0px 15px rgba(255,255,255,0.9);
  }

  @keyframes explode {
    0%{transform:scale(1);}
    100%{transform:scale(2.5);opacity:0;}
  }

  .love-box {
    position:fixed;
    bottom:20px;
    width:90%;
    max-width:500px;
    padding:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    border-radius:25px;
    text-align:center;
    color:#fff;
    font-size:18px;
    line-height:1.6;
    z-index:10;
    border: 4px solid;
    border-image: linear-gradient(45deg, #ff4d6d, #ff6f91, #ffc75f) 1;
    animation: floatBox 3s ease-in-out infinite alternate;
    box-shadow: 0px 6px 20px rgba(0,0,0,0.4);
  }

  @keyframes floatBox {
    from {transform: translateY(0px);}
    to {transform: translateY(-8px);}
  }
</style>
</head>
<body>

<div class="heart-container"></div>

<div class="love-box" id="loveText">
  আজ আমার হৃদয় শুধু তোমারই জন্য স্পন্দিত…
</div>

<script>
  const heartContainer = document.querySelector('.heart-container');
  const loveText = document.getElementById('loveText');

  const hearts = ["নাজমিন","মোতালেব"];
  const colors = ["#ff4d6d","#ff6f91","#ff9671","#ffc75f","#f9f871"];
  const sizes = [40,45,50,55,60];
  const phrases = [
    "আমি তোমাকে অশেষ ভালোবাসি…",
    "তোমার হাসিই আমার শোনার গান…",
    "প্রতিটি দিন শুধুই তোমার নামের সঙ্গে শুরু করি…",
    "তুমি ছাড়া দিনটা যেন অসম্পূর্ণ…",
    "হৃদয় কেবল তোমার জন্যই স্পন্দিত…"
  ];

  function createHeart(){
    const heart = document.createElement('div');
    heart.classList.add('heart');

    // random name
    heart.textContent = hearts[Math.floor(Math.random()*hearts.length)];

    // random color
    heart.style.background = colors[Math.floor(Math.random()*colors.length)];

    // random size
    const size = sizes[Math.floor(Math.random()*sizes.length)];
    heart.style.width = size + "px";
    heart.style.height = size + "px";
    heart.style.fontSize = (size/3) + "px";

    // position
    heart.style.left = Math.random()*90 + "vw";
    heart.style.animationDuration = (5 + Math.random()*4) + "s";

    // click effect
    heart.addEventListener('click', ()=>{
      heart.classList.add('blast');
      loveText.textContent = phrases[Math.floor(Math.random()*phrases.length)];
      setTimeout(()=> heart.remove(), 400);
    });

    heartContainer.appendChild(heart);
    setTimeout(()=>heart.remove(),10000);
  }

  setInterval(createHeart,400);
</script>

</body>
</html>
