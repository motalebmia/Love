<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Page</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    background: linear-gradient(160deg,#ff9a9e,#fad0c4,#fbc2eb);
    background-size: 400% 400%;
    animation: bgAnim 15s ease infinite;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    position: relative;
  }

  @keyframes bgAnim{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .heart-container{
    position:absolute;
    bottom:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .heart{
    position:absolute;
    bottom:0;
    width:50px;
    height:50px;
    cursor:pointer;
    pointer-events:auto;
    user-select:none;
    animation: floatUp linear forwards;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background-color:#ff4d6d;
    color:white;
    font-size:12px; /* choto naam */
    text-align:center;
    line-height:1;
    font-weight:bold;
  }

  @keyframes floatUp{
    0%{transform:translateY(0);}
    100%{transform:translateY(-120vh);}
  }

  .blast{
    animation: explode 0.5s forwards;
  }

  @keyframes explode{
    0%{transform:scale(1);opacity:1;}
    100%{transform:scale(2.5);opacity:0;}
  }

  .love-box{
    position:fixed;
    bottom:20px;
    width:90%;
    max-width:500px;
    padding:15px 20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(8px);
    border-radius:20px;
    text-align:center;
    color:#fff;
    font-size:16px;
    line-height:1.5;
    z-index:10;
  }

  /* Floating tiny particles around heart */
  .particle{
    position:absolute;
    width:5px;
    height:5px;
    background:rgba(255,255,255,0.8);
    border-radius:50%;
    pointer-events:none;
    animation: particleAnim linear forwards;
  }

  @keyframes particleAnim{
    0%{transform:translate(0,0);opacity:1;}
    100%{transform:translate(var(--x,0),var(--y,-60px));opacity:0;}
  }
</style>
</head>
<body>

<div class="heart-container"></div>

<div class="love-box">
  নাজমিন এবং মোতালেবের ভালোবাসা অনন্ত।<br>
  প্রতিটি মুহূর্ত তাদের জন্য আনন্দ এবং একে অপরের প্রতি শ্রদ্ধা ও যত্নের সাক্ষী।<br>
  সত্যিকারের ভালোবাসা হলো একে অপরকে বোঝা, সম্মান করা এবং প্রতিদিনকে আরও সুন্দর করে তোলা।
</div>

<script>
const heartContainer=document.querySelector('.heart-container');
const names=["নাজমিন","মোতালেব"];
const colors=["#ff4d6d","#ff6f91","#ff9671","#ffc75f","#f9f871"];
const sizes=[40,45,50,55,60];

function createHeart(){
  const heart=document.createElement('div');
  heart.classList.add('heart');

  // Random name choto
  heart.textContent=names[Math.floor(Math.random()*names.length)];

  // Random color
  heart.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];

  // Random size
  const size=sizes[Math.floor(Math.random()*sizes.length)];
  heart.style.width=size+'px';
  heart.style.height=size+'px';
  heart.style.fontSize=(size/4)+'px'; // choto text
  heart.style.lineHeight='1';

  // Random horizontal position
  heart.style.left=Math.random()*90+'vw';

  // Random animation duration
  heart.style.animationDuration=(5+Math.random()*5)+'s';

  // Click to explode
  heart.addEventListener('click',()=>{
    heart.classList.add('blast');
    createParticles(heart);
    setTimeout(()=>heart.remove(),500);
  });

  heartContainer.appendChild(heart);

  // Remove after 10s
  setTimeout(()=>heart.remove(),10000);
}

// create floating tiny particles around heart
function createParticles(heart){
  const count=5;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.classList.add('particle');
    const x=(Math.random()-0.5)*50;
    const y=-Math.random()*60;
    p.style.left=heart.offsetLeft + heart.offsetWidth/2 + 'px';
    p.style.top=heart.offsetTop + heart.offsetHeight/2 + 'px';
    p.style.setProperty('--x',x+'px');
    p.style.setProperty('--y',y+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }
}

// continuously create hearts
setInterval(createHeart,500);
</script>

</body>
</html>
