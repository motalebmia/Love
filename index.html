<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.cdnfonts.com/css/li-ador-noirrit" rel="stylesheet">

<title>Love Page</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  overflow:hidden;
  background:#000;
  font-family:'Li Ador Noirrit', sans-serif;
}

/* Sparkles */
.sparkle{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation: sparkleAnim 2s linear infinite;
}
@keyframes sparkleAnim{
  0%{opacity:0;}
  50%{opacity:1;}
  100%{opacity:0;}
}

/* Heart container */
.heart-container{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* ❤️ MAIN HEART */
.heart{
  position:absolute;
  bottom:-60px;
  transform: rotate(-45deg);
  cursor:pointer;
  pointer-events:auto;
  animation: floatUp linear forwards, pulse 1.5s infinite;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
}

/* heart shape */
.heart::before,
.heart::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:inherit;
  border-radius:50%;
}
.heart::before{ top:-50%; left:0; }
.heart::after{ left:50%; top:0; }

/* text */
.heart span{
  position:absolute;
  transform: rotate(45deg);
  color:#fff;
  font-weight:bold;
  width:100%;
  text-align:center;
  top:30%;
  font-size:10px;
}

/* FLOAT */
@keyframes floatUp{
  from{transform:translateY(0) rotate(-45deg);}
  to{transform:translateY(-130vh) rotate(-45deg);}
}

@keyframes pulse{
  0%{scale:1;}
  50%{scale:1.15;}
  100%{scale:1;}
}

/* TRAIL */
.trail{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  opacity:0.7;
  animation: trailFade 1s linear forwards;
}
@keyframes trailFade{
  to{opacity:0; transform:scale(0.3);}
}

/* MINI HEART */
.mini-heart{
  position:absolute;
  width:10px;
  height:10px;
  background:red;
  transform: rotate(-45deg);
  animation: miniExplode 0.8s forwards;
}
.mini-heart::before,
.mini-heart::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:inherit;
  border-radius:50%;
}
.mini-heart::before{ top:-50%; }
.mini-heart::after{ left:50%; }

@keyframes miniExplode{
  to{
    transform: translate(var(--x), var(--y)) rotate(-45deg);
    opacity:0;
  }
}

/* LOVE BOX */
.love-box{
  position:fixed;
  bottom:20px;
  width:90%;
  max-width:500px;
  padding:18px;
  border-radius:30px;
  text-align:center;
  font-size:18px;
  color:white;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(6px);

  border:2px solid;
  border-image:linear-gradient(45deg,#ff4d6d,#ffc75f,#ff6f91) 1;

  box-shadow:0 0 20px rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<div class="heart-container"></div>

<div class="love-box" id="loveText">
  তুমি আমার হৃদয়ের সবচেয়ে সুন্দর অনুভূতি…
</div>

<audio id="popSound" preload="auto">
  <source src="https://www.fesliyanstudios.com/play-mp3/387">
</audio>

<script>
const heartContainer=document.querySelector('.heart-container');
const loveText=document.getElementById('loveText');
const sound=document.getElementById('popSound');

const names=["নাজমিন","মোতালেব"];
const colors=["#ff4d6d","#ff6f91","#ffc75f","#00f5d4","#f15bb5","#9b5de5"];

const phrases=[
"তুমি আমার জীবনের সবচেয়ে সুন্দর গল্প…",
"তুমি ছাড়া সবকিছুই ফাঁকা লাগে…",
"তোমার হাসিই আমার পৃথিবী…",
"প্রতিদিন নতুন করে তোমার প্রেমে পড়ি…",
"তুমি আমার হৃদয়ের স্পন্দন…"
];

// sparkles
setInterval(()=>{
  const s=document.createElement('div');
  s.className='sparkle';
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),2000);
},200);

// create trail
function createTrail(x,y){
  const t=document.createElement('div');
  t.className='trail';
  t.style.left=x+"px";
  t.style.top=y+"px";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1000);
}

// mini explosion hearts
function explodeHearts(x,y){
  for(let i=0;i<8;i++){
    const m=document.createElement('div');
    m.className='mini-heart';

    const angle=Math.random()*360;
    const distance=30+Math.random()*40;

    const dx=Math.cos(angle)*distance;
    const dy=Math.sin(angle)*distance;

    m.style.left=x+"px";
    m.style.top=y+"px";
    m.style.setProperty('--x',dx+"px");
    m.style.setProperty('--y',dy+"px");

    document.body.appendChild(m);
    setTimeout(()=>m.remove(),800);
  }
}

// create heart
function createHeart(){
  const heart=document.createElement('div');
  heart.className='heart';

  const size=40+Math.random()*20;
  heart.style.width=size+"px";
  heart.style.height=size+"px";

  const color=colors[Math.floor(Math.random()*colors.length)];
  heart.style.background=color;

  heart.style.left=Math.random()*90+"vw";
  heart.style.animationDuration=(5+Math.random()*5)+"s";

  const span=document.createElement('span');
  span.textContent=names[Math.floor(Math.random()*names.length)];
  span.style.color=colors[Math.floor(Math.random()*colors.length)];
  heart.appendChild(span);

  // trail effect
  const trailInterval=setInterval(()=>{
    const rect=heart.getBoundingClientRect();
    createTrail(rect.left+rect.width/2, rect.top+rect.height/2);
  },100);

  heart.onclick=()=>{
    heart.classList.add('blast');

    sound.currentTime=0;
    sound.play();

    const rect=heart.getBoundingClientRect();
    explodeHearts(rect.left+20, rect.top+20);

    loveText.textContent=phrases[Math.floor(Math.random()*phrases.length)];
    loveText.style.color=colors[Math.floor(Math.random()*colors.length)];

    clearInterval(trailInterval);
    setTimeout(()=>heart.remove(),400);
  };

  heartContainer.appendChild(heart);

  setTimeout(()=>{
    clearInterval(trailInterval);
    heart.remove();
  },10000);
}

setInterval(createHeart,400);
</script>

</body>
</html>
